# ============================================================================
# CI specification — VECTOR LOCAL CI (self-hosted, no GitHub Actions)
# Executed locally via `act` (Docker) by the workspace-root orchestrator
# `run-ci.mjs`. See /CI.md for how to run.
# ============================================================================
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python health/unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
