name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate
        run: python3 -m py_compile src/vector_bus_client/*.py
      - name: Unit tests
        run: PYTHONPATH=src:vendor python3 -m unittest discover -s tests
      - name: Vendor drift check
        run: python3 scripts/check_vendor.py
